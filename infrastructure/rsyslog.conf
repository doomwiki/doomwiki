# Forward local6 facility (Apache and PHP logs) to CloudWatch
# Note: imuxsock module is loaded by default in the main rsyslog.conf

# Forward only local6 facility (Apache and PHP logs) to CloudWatch
local6.* action(type="omfwd" target="127.0.0.1" port="24224" protocol="tcp"
            action.resumeRetryCount="-1"
            queue.type="linkedList"
            queue.saveOnShutdown="on")