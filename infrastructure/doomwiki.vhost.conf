<VirtualHost *:8080>
    DocumentRoot /home/doomwiki
    <Directory /home/doomwiki>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    LogLevel warn
    ErrorLog /var/log/httpd/doomwiki-error.log
    CustomLog /var/log/httpd/doomwiki-access.log combined
    # AWS Linux enables Apache's /icons/ alias by default, which takes over all
    # /icons paths to host Apache logo icons. We do not want this logo content
    # visible, so for now we deny access to /icons. If the application needs to
    # use an /icons paths for something then these lines need to be removed AND
    # Apache's httpd.conf needs to be altered to remove the /icons alias there.
    <Location "/icons/">
       Require all denied
    </Location>
    # Block doomwiki theme readme file
    <Files "README.txt">
      Order allow,deny
      Deny from all
    </Files>
    # TEMPORARY block of crawlers. Remove after public launch!
    # Header set X-Robots-Tag "noindex, nofollow"
</VirtualHost>
# Disable server signature and tokens to prevent information leakage
ServerTokens Prod
ServerSignature Off
