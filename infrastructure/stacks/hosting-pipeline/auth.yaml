AWSTemplateFormatVersion: 2010-09-09
Description: Cognito Stack
Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name for cognito resources
    Default: dev
  ProjectURL:
    Type: String
  EmailInvitationSubject:
    Type: String
    Default: >
      PREP Evaluation: Your User Account
  DBAdminSecret:
    Type: String
  DBCluster:
    Type: String
  ReplyToEmailAddress:
    Type: String
    Default: "doomwiki@mancubus.net"
  EmailDomainSourceArn:
    Type: String
    Default: ""
  AWSApplicationArn:
    Description: ARN of the associated, pre-defined AWS Application
    Type: String
    Default: ""

Conditions:
  IsLocal: !Equals
    - !Ref EnvironmentName
    - local
  IsDev: !Equals
    - !Ref EnvironmentName
    - dev
  IsQa: !Equals
    - !Ref EnvironmentName
    - qa
  IsStaging: !Equals
    - !Ref EnvironmentName
    - stg
  # Note: we only run the Burpsuite security scan in the dev environment, so
  # theoretically we should only need the security scan resources in dev.
  # However, when testing, we found that the custom auth lambdas were enabled
  # for the local and qa environment, and removing them from the local user pool
  # broke the authentication process. The stg environment does not have those
  # custom auth lambdas, so they are not essential, but we don't necessarily
  # have time to track down exactly why they're in place and required for local/qa.
  # So this approach applies the resoures to all of local/dev/qa, to keep things
  # working.
  CreateSecurityScanResources: !Or
    - !Condition IsLocal
    - !Condition IsDev
    - !Condition IsQa
    - !Condition IsStaging

Resources:
  SNSRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub SNSRole-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cognito-idp.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: !Sub CognitoSNSPolicy-${EnvironmentName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "sns:publish"
                Resource: "*"
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn

  # This section defines an execution role and Lambda functions called by Cognito to manage
  # actions and additional custom logic during the authentication process. This was originally
  # developed to allow Burpsuite test accounts to bypass MFA, but we will also use it
  # to add custom logic to the account lockout feature to meet FedRAMP requirements.
  CognitoAuthLambdasRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub CognitoLambdasRole-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub CognitoAuthorizedPolicy-${EnvironmentName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cognito-identity:*
                  - cognito-idp:*
                  - cognito-sync:*
                  - iam:ListRoles
                  - iam:ListOpenIdConnectProviders
                  - iam:GetRole
                  - iam:ListSAMLProviders
                  - iam:GetSAMLProvider
                  - kinesis:ListStreams
                  - lambda:GetPolicy
                  - lambda:ListFunctions
                  - sns:GetSMSSandboxAccountStatus
                  - sns:ListPlatformApplications
                  - ses:ListIdentities
                  - ses:GetIdentityVerificationAttributes
                  - mobiletargeting:GetApps
                  - acm:ListCertificates
                  - secretsmanager:GetSecretValue
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    "iam:AWSServiceName":
                      - "cognito-idp.amazonaws.com"
                      - "email.cognito-idp.amazonaws.com"
              - Effect: Allow
                Action:
                  - iam:DeleteServiceLinkedRole
                  - iam:GetServiceLinkedRoleDeletionStatus
                Resource:
                  - "arn:aws:iam::*:role/aws-service-role/cognito-idp.amazonaws.com/AWSServiceRoleForAmazonCognitoIdp*"
                  - "arn:aws:iam::*:role/aws-service-role/email.cognito-idp.amazonaws.com/AWSServiceRoleForAmazonCognitoIdpEmail*"
              - Effect: Allow
                Action: "rds-data:*"
                # RDS db cluster ARNs are not directly available - need to be constructed.
                # See https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_Tagging.ARN.html
                # So for now, leaving it out to save time. But ideally this would specify
                # this environment's db cluster only.
                Resource: "*"
              - Effect: Allow
                Action: "rds:DescribeDBClusters"
                # Same issue described above, we can't get the cluster ARN directly from the stack,
                # so granting access to describe attributes of all clusters.
                Resource: "*"
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn

  CognitoUnAuthorizedRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub CognitoUnAuthorizedRole-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": unauthenticated
      Policies:
        - PolicyName: !Sub CognitoUnauthorizedPolicy-${EnvironmentName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "mobileanalytics:PutEvents"
                  - "cognito-sync:*"
                Resource: "*"
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn

  CognitoAuthorizedRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub CognitoAuthorizedRole-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: !Sub CognitoAuthorizedPolicy-${EnvironmentName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "mobileanalytics:PutEvents"
                  - "cognito-sync:*"
                  - "cognito-identity:*"
                Resource: "*"
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn

  LambdaCreateAuthChallenge:
    Type: "AWS::Lambda::Function"
    Condition: CreateSecurityScanResources
    Properties:
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn    
      FunctionName: !Sub "${EnvironmentName}-create-auth-challenge"
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt CognitoAuthLambdasRole.Arn
      Runtime: nodejs20.x
      Timeout: 3
      Code:
        ZipFile: |
          exports.handler = (event, context, callback) => {
            console.log('event.request', event.request)
            if (event.request.challengeName == 'CUSTOM_CHALLENGE') {
                event.response.publicChallengeParameters = {};
                event.response.publicChallengeParameters.authUserCode = 'User code'
                event.response.privateChallengeParameters = {};
                event.response.privateChallengeParameters.answer = event.request.userAttributes['custom:metadata'];
                event.response.challengeMetadata = 'USERCODE_CHALLENGE';
            }
            callback(null, event);
          }

  LambdaDefineAuthChallenge:
    Type: "AWS::Lambda::Function"
    Condition: CreateSecurityScanResources
    Properties:
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn    
      FunctionName: !Sub "${EnvironmentName}-define-auth-challenge"
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt CognitoAuthLambdasRole.Arn
      Runtime: nodejs20.x
      Timeout: 3
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const smClient = new AWS.SecretsManager({apiVersion: '2017-10-17'});

          exports.handler = (event, context, callback) => {
            console.log('event.request', event)

            var secretParams = {
              SecretId: 'SECURITY_SCAN_USER',
            };

            smClient.getSecretValue(secretParams, function(err, data) {
              // Temporarily prevent stopping on error until the secret can be properly handled
              if (err) console.log(err, err.stack);

              console.log(' -- secret retrieved');

              if (event.request.session.length == 1 && event.request.session[0].challengeName == 'SRP_A') {
                event.response.issueTokens = false;
                event.response.failAuthentication = false;
                event.response.challengeName = 'PASSWORD_VERIFIER';
              } else if (
                event.request.session.length == 2 && event.request.session[1].challengeName == 'PASSWORD_VERIFIER' && event.request.session[1].challengeResult == true) {
                const securityScanUser = data?.SecretString ? JSON.parse(data.SecretString)?.SECURITY_SCAN_USER : '';
                console.log(' -- securityScanUser: ', securityScanUser);

                if (securityScanUser.split(",").includes(event.request.userAttributes.sub)) {
                  event.response.issueTokens = false;
                  event.response.failAuthentication = false;
                  event.response.challengeName = 'CUSTOM_CHALLENGE';
                } else {
                  event.response.issueTokens = true;
                  event.response.failAuthentication = false;
                  event.response.challengeName = 'SELECT_MFA_TYPE';
                }
              } else if (
                event.request.session.length == 3 && event.request.session[2].challengeName == 'CUSTOM_CHALLENGE' && event.request.session[2].challengeResult == true) {
                event.response.issueTokens = true;
                event.response.failAuthentication = false;
                // adding MFA just in case
              } else if (event.request.session.length == 3 && (event.request.session[2].challengeName == 'SMS_MFA' || event.request.session[2].challengeName == 'SOFTWARE_TOKEN_MFA') && event.request.session[2].challengeResult == true) {
                event.response.issueTokens = true;
                event.response.failAuthentication = false;
              } else {
                event.response.issueTokens = false;
                event.response.failAuthentication = true;
              }

              console.log('event.response', event.response)
              // Return to Amazon Cognito
              callback(null, event);
            });
          }

  LambdaCustomEmails:
    Type: "AWS::Lambda::Function"
    Properties:
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn    
      FunctionName: !Sub "${EnvironmentName}-custom-emails"
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt CognitoAuthLambdasRole.Arn
      Runtime: nodejs20.x
      Timeout: 3
      Environment:
        Variables:
          ProjectURL: !Ref ProjectURL
          ReplyToEmailAddress: !Ref ReplyToEmailAddress
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const code = event.request.codeParameter;
            const url = process.env.ProjectURL;
            const ReplyToEmailAddress = process.env.ReplyToEmailAddress;
            if (event.triggerSource === "CustomMessage_ForgotPassword") {
              let message = `<p>Dear PREP Evaluation user:</p> 
                             <p>Your password reset code is ${code}</p>
                              <p>Still having trouble signing in to <a href="https://${url}">PREP Evaluation</a>?
                              Please contact the help desk at <a href="mailto:${ReplyToEmailAddress}">${ReplyToEmailAddress}</a> as needed.</p>`;
              event.response.emailMessage = message;
            }
            return event;
          };

  LambdaVerifyAuthChallenge:
    Type: "AWS::Lambda::Function"
    Condition: CreateSecurityScanResources
    Properties:
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn
      FunctionName: !Sub "${EnvironmentName}-verify-auth-challenge"
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt CognitoAuthLambdasRole.Arn
      Runtime: nodejs20.x
      Timeout: 3
      Code:
        ZipFile: |
          exports.handler = (event, context, callback) => {
            console.log('event is: ', event)
            console.log('event request: ', event.request)
            console.log('event response before: ', event.response)
            if (event.request.privateChallengeParameters.answer == event.request.challengeAnswer) {
                event.response.answerCorrect = true;
            } else {
                event.response.answerCorrect = false;
            }
            console.log('event response after: ', event.response)
            callback(null, event);
          }

  UserPool:
    Type: "AWS::Cognito::UserPool"
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-user-pool"
      UserPoolTags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: True
        InviteMessageTemplate:
          EmailMessage: !Sub >
            <html>
            <body>
            <font face="Calibri,sans-serif">
            <p>Dear user:</p>
            <p></p>
            </body>
            </html>
          EmailSubject: !Ref EmailInvitationSubject
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          TemporaryPasswordValidityDays: 60
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      # UsernameAttributes:
      #   - email
      # UsernameConfiguration:
      #   CaseSensitive: false
      EnabledMfas:
        - SMS_MFA
        - SOFTWARE_TOKEN_MFA
      LambdaConfig:
        CreateAuthChallenge: !If
          - CreateSecurityScanResources
          - !GetAtt LambdaCreateAuthChallenge.Arn
          - !Ref "AWS::NoValue"
        DefineAuthChallenge: !If
          - CreateSecurityScanResources
          - !GetAtt LambdaDefineAuthChallenge.Arn
          - !Ref "AWS::NoValue"
        VerifyAuthChallengeResponse: !If
          - CreateSecurityScanResources
          - !GetAtt LambdaVerifyAuthChallenge.Arn
          - !Ref "AWS::NoValue"
        PreAuthentication: !GetAtt LambdaPrePostAuthTrigger.Arn
        PostAuthentication: !GetAtt LambdaPrePostAuthTrigger.Arn
        CustomMessage: !GetAtt LambdaCustomEmails.Arn
      MfaConfiguration: OPTIONAL
      SmsAuthenticationMessage: "Your PREP Evaluation authentication code is {####}"
      SmsVerificationMessage: "Your PREP Evaluation verification code is {####}"
      SmsConfiguration:
        ExternalId: !Sub "${ProjectName}-${EnvironmentName}-external"
        SnsCallerArn: !GetAtt SNSRole.Arn
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: family_name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: metadata
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MaxLength: 2048
        - Name: last_login
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: 1
            MaxLength: 2048
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: !Sub "System <no-reply@${ProjectURL}>"
        ReplyToEmailAddress: !Ref ReplyToEmailAddress
        SourceArn: !Sub "arn:aws:ses:us-east-1:${AWS::AccountId}:identity/${ProjectURL}"

  UserPoolAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      Description: Mathematica admins group
      GroupName: Admins
      Precedence: 0
      # RoleArn: String
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: "AWS::Cognito::UserPoolClient"
    Properties:
      ClientName: !Sub "${EnvironmentName}-client"
      GenerateSecret: false
      UserPoolId: !Ref UserPool
      AuthSessionValidity: 6

  IdentityPool:
    Type: "AWS::Cognito::IdentityPool"
    Properties:
      IdentityPoolName: !Sub "${EnvironmentName}Identity"
      AllowUnauthenticatedIdentities: true
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  IdentityPoolRoleMapping:
    Type: "AWS::Cognito::IdentityPoolRoleAttachment"
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthorizedRole.Arn
        unauthenticated: !GetAtt CognitoUnAuthorizedRole.Arn

  LambdaPrePostAuthTrigger:
    Type: "AWS::Lambda::Function"
    Properties:
      Tags:
        - Key: platform
          Value: !Ref ProjectName
        - Key: awsApplication
          Value: !Ref AWSApplicationArn
      FunctionName: !Sub "${EnvironmentName}-pre-post-auth-trigger"
      Handler: index.lambda_handler
      MemorySize: 128
      Role: !GetAtt CognitoAuthLambdasRole.Arn
      Runtime: python3.11
      Timeout: 10
      Environment:
        Variables:
          ENV: !Ref EnvironmentName
          DB_AdminSecret: !Ref DBAdminSecret
          DB_Cluster: !Ref DBCluster
      Code:
        ZipFile: !Sub |
          import boto3
          import os

          def lambda_handler(event, context):
            
            return event
            
          def pre_auth(params):
            '''TODO: Checks whether user is already locked out - if so, rejects authentication attempt.
              Otherwise, logs data to be used in calculating future lockout periods.'''
            
            return True
            
          def post_auth(params):
            '''TODO: Re-sets user's lockout status/time and failed auth attempts log upon
              successful authentication (post-auth Cognito trigger).'''
            
            return True

  LambdaCreateAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateSecurityScanResources
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaCreateAuthChallenge.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  LambdaDefineAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateSecurityScanResources
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaDefineAuthChallenge.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  LambdaVerifyAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateSecurityScanResources
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaVerifyAuthChallenge.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  LambdaPrePostAuthTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaPrePostAuthTrigger.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  LambdaCustomEmailsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaCustomEmails.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Description: ARN for the user pool
  UserPoolClient:
    Description: The user pool app client id for web
    Value: !Ref UserPoolClient
  IdentityPoolId:
    Value: !Ref IdentityPool
