AWSTemplateFormatVersion: 2010-09-09
Description: The resources used to create the WebApp unit testing environment.
Parameters:
  EnvironmentName:
    Type: String
    Description: The name for the environment that this cloudformation will be part of.
  ProjectName:
    Description: Primary project short name
    Type: String
  DomainName:
    Description: Custom domain name attached to the load balancer (required for HTTPS)
    Type: String
  DatabaseName:
    Type: String
    Default: ""

Resources:
  CodeTestBuildServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub CodeTestBuildServiceRole-${ProjectName}-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: !Sub CodeTestBuildServiceRole-${ProjectName}-${EnvironmentName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: "*"
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
              - Resource: "*"
                Effect: Allow
                Action:
                  - "ec2:*"
                  - "lambda:*"
                  - "cloudfront:*"
                  - "rds:*"
                  - "rds-data:*"
                  - "secretsmanager:*"
                  - "kms:Encrypt"
                  - "kms:Decrypt"
                  - "kms:ReEncrypt*"
                  - "kms:GenerateDataKey*"
                  - "kms:DescribeKey"
                  - "s3:*"
      Tags:
        - Key: platform
          Value: !Ref ProjectName

  CodeTestBuildProject:
    Type: "AWS::CodeBuild::Project"
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-CodeTestBuildProject
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: latest
            build:
              commands:
                - cd $CODEBUILD_SRC_DIR
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: "aws/codebuild/amazonlinux2-x86_64-standard:5.0"
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ENV
            Value: !Ref EnvironmentName
      ServiceRole: !Ref CodeTestBuildServiceRole
      Tags:
        - Key: platform
          Value: !Ref ProjectName

Outputs:
  CodeBuildProject:
    Value: !Ref CodeTestBuildProject
