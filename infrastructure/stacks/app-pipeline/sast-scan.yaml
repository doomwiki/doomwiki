AWSTemplateFormatVersion: "2010-09-09"
Description: Stage for SAST scanning via Veracode
Parameters:
  EnvironmentName:
    Description: Environment name
    Type: String
    Default: "dev"
    AllowedValues:
      - "dev"
      - "qa"
      - "stg"
      - "prod"
  ProjectName:
    Type: String
    Description: Project short name
  VeracodeSandboxName:
    Description: Sandbox name for Veracode dev scanning
    Type: String
Resources:
  CodeScanServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SASTScanServiceRole-${ProjectName}-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service:
                - codebuild.amazonaws.com
      Policies:
        - PolicyName: !Sub SASTScanServiceRole-${ProjectName}-${EnvironmentName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: "*"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:StartBuildBatch
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:*
                Resource: "*"
      Tags:
        - Key: platform
          Value: !Ref ProjectName

  CodeScanProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-CodeScanProject
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2
          phases:
            build:
              commands:
                - echo "***********************SCAN STAGE**********************"
                - TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
                - pwd
                - cd $CODEBUILD_SRC_DIR
                - chmod +x ./scripts/sast-scan.sh
                - ls -l
                - zip -r ${ProjectName}.zip app scripts -x "* /.*"
                - ./scripts/sast-scan.sh {{resolve:ssm:VeracodeId}} {{resolve:ssm:VeracodeKey}} "Scan from AWS deployment - ${ProjectName} at $TIMESTAMP" ${ProjectName}
                - cat /etc/os-release
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref AWS::NoValue
        ImagePullCredentialsType: SERVICE_ROLE
        Type: LINUX_CONTAINER
        PrivilegedMode: false
      ServiceRole: !Ref CodeScanServiceRole
      Tags:
        - Key: platform
          Value: !Ref ProjectName

Outputs:
  CodeScanProject:
    Value: !Ref CodeScanProject
